[project]
name = "payops-sentinel"
version = "0.1.0"
description = "Governed, local-first AI investigation of synthetic payroll contribution exceptions"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=2,<3",
    "ollama>=0.6,<1",
    "pydantic>=2,<3",
    "streamlit>=1.50,<2",
]

[project.scripts]
payops = "payops_sentinel.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra -m \"not ollama\""
markers = ["ollama: requires a running local Ollama with the configured model (excluded in CI)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
